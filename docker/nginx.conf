server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API is proxied under the same origin the app is served from. Same
    # reasoning as the Vite dev proxy: no CORS configuration to get wrong, and
    # the paths are identical in development and production.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report uploads are larger than nginx's 1MB default, which would
        # otherwise reject an Allure archive with an opaque 413.
        client_max_body_size 64m;
    }

    # Client-side routing: any unknown path is a React route, not a 404. Test
    # ids contain slashes, so deep links have many segments and this matters.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
