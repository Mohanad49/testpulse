# Fly.io, not Railway, for one reason that matters here: a scale-to-zero service
# with a managed Postgres is free-tier viable, and a portfolio demo that costs
# money every month is a portfolio demo that gets switched off in six weeks.

app = "testpulse-api"
primary_region = "cdg"   # Paris — closest low-latency region to Cairo.

[build]
  dockerfile = "docker/api.Dockerfile"

[env]
  TESTPULSE_ENV = "production"   # makes the app refuse to boot without ingest keys

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero, deliberately. This is a demo that is idle most of the time; the first
  # request after a suspend pays a cold start and that is the correct trade for
  # a service nobody is paying for.
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Migrations run once per deploy, before the new machines take traffic. Same
# reasoning as the compose setup: an app that migrates in its entrypoint cannot
# be scaled and two instances racing to migrate is a bug waiting to happen.
[deploy]
  release_command = "sh -c 'cd /app/packages/testpulse-core && alembic upgrade head'"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
