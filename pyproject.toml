[project]
name = "testpulse"
version = "0.1.0"
description = "Test observability and flake-detection platform for CI test suites."
requires-python = ">=3.12"
dependencies = ["testpulse-core", "testpulse-api"]

[project.optional-dependencies]
postgres = ["testpulse-core[postgres]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]
# testpulse-web is a pnpm package that happens to live under packages/. The glob
# picks it up and uv then fails the whole workspace because it has no
# pyproject.toml.
exclude = ["packages/testpulse-web"]

[tool.uv.sources]
testpulse-core = { workspace = true }
testpulse-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
    "hypothesis>=6.163.0",
    "httpx>=0.28",
    "jsonschema>=4.23",
]
